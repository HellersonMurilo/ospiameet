<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#2f9bff"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffb627"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f3a"/>
      <stop offset="1" stop-color="#0d1024"/>
    </linearGradient>
    <clipPath id="shape"><rect width="512" height="512" rx="118"/></clipPath>
  </defs>

  <!-- fundo -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <g clip-path="url(#shape)">
    <circle cx="420" cy="92" r="150" fill="#fff" opacity=".08"/>
    <circle cx="70" cy="460" r="120" fill="#000" opacity=".08"/>
  </g>

  <!-- pé do monitor -->
  <rect x="226" y="386" width="60" height="38" fill="#fff" opacity=".9"/>
  <rect x="170" y="416" width="172" height="26" rx="13" fill="#fff"/>

  <!-- monitor com carinha -->
  <rect x="84" y="170" width="344" height="232" rx="44" fill="#fff"/>
  <rect x="108" y="194" width="296" height="184" rx="24" fill="url(#glass)"/>
  <circle cx="200" cy="282" r="20" fill="#fff"/>
  <circle cx="312" cy="282" r="20" fill="#fff"/>
  <path d="M212 322 q44 34 88 0" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <!-- bochechas -->
  <circle cx="160" cy="318" r="13" fill="#ff7aa8" opacity=".85"/>
  <circle cx="352" cy="318" r="13" fill="#ff7aa8" opacity=".85"/>

  <!-- boné, meio de lado -->
  <g transform="rotate(-9 256 170)">
    <path d="M360 176 h108 a22 22 0 0 1 0 44 h-150 z" fill="#e89a12"/>
    <path d="M112 196 a144 132 0 0 1 288 0 v6 a18 18 0 0 1 -18 18 h-252 a18 18 0 0 1 -18 -18 z" fill="url(#cap)"/>
    <path d="M256 66 q-56 60 -60 154" fill="none" stroke="#e89a12" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <path d="M256 66 q56 60 60 154" fill="none" stroke="#e89a12" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <circle cx="256" cy="64" r="15" fill="#e89a12"/>
  </g>
</svg>
